<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化交易執行助手</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary: #1DB954; --dark: #002D72; --danger: #FF4B4B; --blue: #4B7BFF; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* 設定面板樣式 */
        .settings-btn { background: none; border: 1px solid #ccc; border-radius: 20px; padding: 5px 12px; font-size: 12px; float: right; }
        .settings-panel { display: none; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .settings-panel input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        /* 下單控制區 */
        h2 { font-size: 18px; color: var(--dark); margin: 0 0 10px 0; }
        .input-group { display: flex; align-items: center; margin: 15px 0; background: #eef2f7; padding: 10px; border-radius: 8px; }
        .input-group input { flex: 1; border: none; background: none; font-size: 20px; font-weight: bold; text-align: center; color: var(--dark); }
        
        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 12px; color: #888; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        td { padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .stock-code { font-weight: bold; display: block; }
        .stock-price { font-size: 12px; color: #666; }
        .shares-val { font-weight: bold; color: var(--primary); text-align: right; }
        
        /* 執行按鈕 */
        .exec-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .btn-init { background: var(--primary); }
        .btn-trade { background: var(--dark); }
    </style>
</head>
<body>

    <div class="card">
        <button onclick="toggleSettings()" class="settings-btn">⚙️ 我的 API 設定</button>
        <h2>交易發射台</h2>
        
        <div id="settingsPanel" class="settings-panel">
            <input type="text" id="apiKey" placeholder="Sinopac API Key">
            <input type="password" id="apiSecret" placeholder="Sinopac Secret Key">
            <input type="text" id="personId" placeholder="身分證字號">
            <input type="password" id="caPass" placeholder="憑證密碼">
            <button onclick="saveSettings()" style="width:100%; padding:8px; background:var(--dark); color:white; border:none; border-radius:4px; margin-top:5px;">儲存於本機</button>
        </div>
    </div>

    <div id="amountSection" class="card" style="display:none;">
        <div style="font-size: 13px; color: #666;">擬投入總金額 (TWD)</div>
        <div class="input-group">
            <button onclick="adjustAmount(-50000)" style="border:none; font-size:20px;">-</button>
            <input type="number" id="amountInput" value="500000" step="50000" oninput="calculateShares()">
            <button onclick="adjustAmount(50000)" style="border:none; font-size:20px;">+</button>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>標的 / 參考價</th>
                    <th style="text-align: center;">動作</th>
                    <th style="text-align: right;">建議股數</th>
                </tr>
            </thead>
            <tbody id="stockList">
                </tbody>
        </table>
    </div>

    <button id="mainExecBtn" class="exec-btn" onclick="confirmAndExecute()">確認並送出委託</button>

<script>
    let mode = 'init'; 
    let stockData = [];

    async function initLIFF() {
        await liff.init({ liffId: "2009650617-0XGQdM6J" });
        loadSettings();
        parseUrlParams();
    }

    // 1. 解析來自 LINE 卡片的資料
    function parseUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('d'); // 代碼:價格:股數:動作
        mode = params.get('v') || 'init';
        
        if (!raw) return;

        stockData = raw.split(',').map(item => {
            const [i, p, s, a] = item.split(':');
            return {
                id: i,
                price: parseFloat(p),
                originalQty: parseInt(s),
                action: a === 'B' ? '買進' : '賣出'
            };
        });

        if (mode === 'init') {
            document.getElementById('amountSection').style.display = 'block';
            document.getElementById('mainExecBtn').classList.add('btn-init');
            calculateShares();
        } else {
            document.getElementById('mainExecBtn').classList.add('btn-trade');
            renderTradeList();
        }
    }

    // 2. 計算股數 (均權分配)
    function calculateShares() {
        const totalAmount = parseFloat(document.getElementById('amountInput').value) || 0;
        const perStockAmount = totalAmount / stockData.length;
        
        const tbody = document.getElementById('stockList');
        tbody.innerHTML = '';

        stockData.forEach(s => {
            const shares = Math.floor(perStockAmount / s.price);
            const row = `<tr>
                <td><span class="stock-code">${s.id}</span><span class="stock-price">$${s.price}</span></td>
                <td style="text-align:center; color:var(--danger); font-weight:bold;">${s.action}</td>
                <td class="shares-val">${shares.toLocaleString()} 股</td>
            </tr>`;
            tbody.innerHTML += row;
            s.calculatedQty = shares;
        });
    }

    // 3. 渲染淨額下單列表 (v=trade 模式)
    function renderTradeList() {
        const tbody = document.getElementById('stockList');
        tbody.innerHTML = '';
        stockData.forEach(s => {
            const color = s.action === '買進' ? 'var(--danger)' : 'var(--blue)';
            tbody.innerHTML += `<tr>
                <td><span class="stock-code">${s.id}</span><span class="stock-price">現價 $${s.price}</span></td>
                <td style="text-align:center; color:${color}; font-weight:bold;">${s.action}</td>
                <td class="shares-val">${s.originalQty.toLocaleString()} 股</td>
            </tr>`;
        });
    }

    // 4. API 設定管理
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function saveSettings() {
        const config = {
            k: document.getElementById('apiKey').value,
            s: document.getElementById('apiSecret').value,
            p: document.getElementById('personId').value,
            c: document.getElementById('caPass').value
        };
        localStorage.setItem('sj_config', JSON.stringify(config));
        alert("API 設定已儲存於您的手機本地。");
        toggleSettings();
    }

    function loadSettings() {
        const saved = localStorage.getItem('sj_config');
        if (saved) {
            const c = JSON.parse(saved);
            document.getElementById('apiKey').value = c.k;
            document.getElementById('apiSecret').value = c.s;
            document.getElementById('personId').value = c.p;
            document.getElementById('caPass').value = c.c;
        }
    }

    function adjustAmount(delta) {
        const input = document.getElementById('amountInput');
        input.value = Math.max(0, parseInt(input.value) + delta);
        calculateShares();
    }

    // 5. 執行下單 (發送到後端 Bridge)
    async function confirmAndExecute() {
        const config = JSON.parse(localStorage.getItem('sj_config'));
        if (!config || !config.k) return alert("請先設定您的 API 金鑰！");

        const orderList = stockData.map(s => ({
            code: s.id,
            qty: mode === 'init' ? s.calculatedQty : s.originalQty,
            action: s.action
        })).filter(o => o.qty > 0);

        if (orderList.length === 0) return alert("沒有有效的下單筆數");

        if (!confirm(`確定要送出這 ${orderList.length} 筆委託嗎？\n(帳號: ${config.p})`)) return;

        // 💎 此處呼叫你的後端 Bridge 💎
        try {
            const res = await fetch('https://你的後端網址.com/place_order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config, orders: orderList })
            });
            const result = await res.json();
            alert(result.message || "委託已送出");
        } catch (e) {
            alert("下單失敗，請檢查網路或後端服務設定。");
        }
    }

    initLIFF();
</script>
</body>
</html>
