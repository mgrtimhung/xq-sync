<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XQ 同步助手</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f8f9fa; }
        .btn { display: block; width: 100%; padding: 20px; background: #002752; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; text-decoration: none; margin-top: 20px; }
        .info { color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2 id="st">正在讀取清單...</h2>
    <div id="codes" style="word-break: break-all; color: #1DB954; font-weight: bold;"></div>
    
    <button id="mainBtn" class="btn">立即匯入 XQ App</button>
    <p class="info">若點擊無反應，請確保已安裝 XQ 全球贏家</p>

    <script>
        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            const symbols = params.get('symbols');

            if (symbols) {
                // 清理代碼：移除空格與非必要字元
                const cleanSymbols = symbols.replace(/\s/g, '');
                const xqUrl = "xqlocal://import?symbols=" + cleanSymbols;
                
                document.getElementById('st').innerText = "已準備好 20 支標的";
                document.getElementById('codes').innerText = cleanSymbols;

                const btn = document.getElementById('mainBtn');
                
                // 點擊事件：使用多重跳轉策略
                btn.onclick = () => {
                    // 策略 1: 直接跳轉
                    window.location.href = xqUrl;
                    
                    // 策略 2: 延遲跳轉 (防止被攔截)
                    setTimeout(() => {
                        window.location.replace(xqUrl);
                    }, 500);

                    // 策略 3: 使用 iframe (舊版系統常用)
                    const iframe = document.createElement("iframe");
                    iframe.style.display = "none";
                    iframe.src = xqUrl;
                    document.body.appendChild(iframe);
                };

                // 自動執行一次
                btn.click();
            } else {
                document.getElementById('st').innerText = "未接收到參數";
            }
        }
        main();
    </script>
</body>
</html>
