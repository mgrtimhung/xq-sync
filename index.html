<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Hung 量化下單系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
        <div class="flex items-center mb-4">
            <div class="w-2 h-8 bg-blue-900 rounded-full mr-3"></div>
            <h1 id="title" class="text-2xl font-bold text-gray-800">策略初始化建倉</h1>
        </div>
        
        <p id="desc" class="text-sm text-gray-500 mb-6 bg-blue-50 p-3 rounded-lg border-l-4 border-blue-200">
            請輸入預計投入的總金額，系統將自動均權分配標的。
        </p>

        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">預計投入總金額 (TWD)</label>
            <input type="number" id="totalAmount" placeholder="例如: 1000000" 
                   class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-900 focus:ring-0 outline-none transition-all text-xl font-semibold">
        </div>

        <div class="flex justify-between items-center mb-3 px-1">
            <span class="text-xs font-bold text-gray-400 uppercase">選股標的</span>
            <span id="stockCount" class="text-xs font-bold text-blue-900 bg-blue-100 px-2 py-1 rounded">-- 檔</span>
        </div>

        <div id="stockList" class="space-y-2 mb-8 max-h-80 overflow-y-auto pr-1">
            <div class="animate-pulse text-center py-10 text-gray-400">讀取中...</div>
        </div>

        <button id="execBtn" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:transform active:scale-95 transition-all hover:bg-black disabled:bg-gray-300">
            確認並送出訂單
        </button>
        
        <p class="text-center text-xs text-gray-400 mt-4">© Tim Hung Quantitative Strategy</p>
    </div>

    <script>

        let version = "";

        async function main() {
            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: "2009650617-0XGQdM6J" }); 

                // 2. 解析 URL 參數
                const urlParams = new URLSearchParams(window.location.search);
                const rawData = urlParams.get('d');
                version = urlParams.get('v');

                    renderStockList();
                }
