<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Hung 量化下單系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
        <div class="flex items-center mb-4">
            <div class="w-2 h-8 bg-blue-900 rounded-full mr-3"></div>
            <h1 id="title" class="text-2xl font-bold text-gray-800">策略初始化建倉</h1>
        </div>
        
        <p id="desc" class="text-sm text-gray-500 mb-6 bg-blue-50 p-3 rounded-lg border-l-4 border-blue-200">
            請輸入預計投入的總金額，系統將自動均權分配標的。
        </p>

        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">預計投入總金額 (TWD)</label>
            <input type="number" id="totalAmount" placeholder="例如: 1000000" 
                   class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-900 focus:ring-0 outline-none transition-all text-xl font-semibold">
        </div>

        <div class="flex justify-between items-center mb-3 px-1">
            <span class="text-xs font-bold text-gray-400 uppercase">選股標的</span>
            <span id="stockCount" class="text-xs font-bold text-blue-900 bg-blue-100 px-2 py-1 rounded">-- 檔</span>
        </div>

        <div id="stockList" class="space-y-2 mb-8 max-h-80 overflow-y-auto pr-1">
            <div class="animate-pulse text-center py-10 text-gray-400">讀取中...</div>
        </div>

        <button id="execBtn" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:transform active:scale-95 transition-all hover:bg-black disabled:bg-gray-300">
            確認並送出訂單
        </button>
        
        <p class="text-center text-xs text-gray-400 mt-4">© Tim Hung Quantitative Strategy</p>
    </div>

    <script>
        let stockData = [];
        let version = "";

        async function main() {
            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: "2009650617-0XGQdM6J" }); 

                // 2. 解析 URL 參數
                const urlParams = new URLSearchParams(window.location.search);
                const rawData = urlParams.get('d');
                version = urlParams.get('v');

                if (rawData) {
                    stockData = JSON.parse(decodeURIComponent(rawData));
                    document.getElementById('stockCount').innerText = `${stockData.length} 檔`;
                    renderStockList();
                }

                // 調整介面文字
                if (version && version !== 'init') {
                    document.getElementById('title').innerText = "策略再平衡調倉";
                    document.getElementById('desc').innerText = "根據今日 order.xlsx 指令進行權重與部位調整。";
                    document.getElementById('desc').className = "text-sm text-gray-500 mb-6 bg-green-50 p-3 rounded-lg border-l-4 border-green-200";
                }

                // 3. 監聽金額輸入
                document.getElementById('totalAmount').addEventListener('input', calculateShares);

                // 4. 監聽按鈕點擊
                document.getElementById('execBtn').addEventListener('click', sendOrder);
                
            } catch (err) {
                console.error("LIFF 初始化失敗", err);
                document.getElementById('stockList').innerHTML = `<div class="text-red-500 text-center">載入失敗，請從 LINE 開啟</div>`;
            }
        }

        function renderStockList() {
            const listDiv = document.getElementById('stockList');
            listDiv.innerHTML = stockData.map(item => `
                <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800">${item.i}</span>
                        <span class="text-[10px] text-gray-400">均權分配標的</span>
                    </div>
                    <div class="text-right">
                        <span id="share-${item.i}" class="text-blue-900 font-bold">--</span>
                        <div id="detail-${item.i}" class="text-[10px] text-gray-400">等待輸入金額</div>
                    </div>
                </div>
            `).join('');
        }

        function calculateShares() {
            const total = document.getElementById('totalAmount').value;
            if (!total || stockData.length === 0) return;

            const amountPerStock = total / stockData.length;
            
            stockData.forEach(item => {
                const shareDisplay = document.getElementById(`share-${item.i}`);
                const detailDisplay = document.getElementById(`detail-${item.i}`);
                
                // 如果有價格 (p > 0) 就計算股數，否則顯示分配金額
                if (item.p && item.p > 0) {
                    const shares = Math.floor(amountPerStock / item.p);
                    shareDisplay.innerText = `${shares.toLocaleString()} 股`;
                    detailDisplay.innerText = `參考價: $${item.p}`;
                } else {
                    shareDisplay.innerText = `$${Math.floor(amountPerStock).toLocaleString()}`;
                    detailDisplay.innerText = `平均分配預算`;
                }
            });
        }

        async function sendOrder() {
            const total = document.getElementById('totalAmount').value;
            if (!total || total <= 0) {
                alert("請輸入有效的投入總金額");
                return;
            }

            const btn = document.getElementById('execBtn');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            try {
                const typeText = (version === 'init') ? "【初始建倉】" : "【再平衡調倉】";
                const amountPerStock = Math.floor(total / stockData.length);
                
                let orderDetail = stockData.map(item => `- ${item.i}: $${amountPerStock.toLocaleString()}`).join('\n');
                
                const message = `✅ 策略下單指令已確認\n------------------\n模式：${typeText}\n投入總額：$${parseInt(total).toLocaleString()}\n標的數量：${stockData.length} 檔\n平均分配：$${amountPerStock.toLocaleString()}/檔\n------------------\n${orderDetail}\n\n指令時間：${new Date().toLocaleString()}`;

                if (liff.isInClient()) {
                    await liff.sendMessages([{
                        type: 'text',
                        text: message
                    }]);
                    liff.closeWindow();
                } else {
                    console.log("不在 LINE 環境中，訂單內容：\n", message);
                    alert("非 LINE 環境，請見 Console 紀錄");
                    btn.disabled = false;
                    btn.innerText = "確認並送出訂單";
                }
            } catch (err) {
                alert("傳送失敗: " + err.message);
                btn.disabled = false;
                btn.innerText = "確認並送出訂單";
            }
        }

        main();
    </script>
</body>
</html>
