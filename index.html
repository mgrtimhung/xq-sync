<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指令交割淨額試算</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        <h1 id="pageTitle" class="text-2xl font-black text-gray-800 mb-1">今日交割試算</h1>
        <p id="pageDesc" class="text-[10px] text-gray-400 mb-6 tracking-widest uppercase font-bold text-blue-600">Net Settlement Calculation</p>
        
        <div id="tradeSection" class="bg-black p-6 rounded-[2rem] mb-6 text-white shadow-xl border-t-4 border-blue-500">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-gray-500 uppercase">當日淨額交割 (+需匯入 / -為回流)</span>
                <span class="text-[10px] bg-blue-600 px-2 py-0.5 rounded text-white">T+2 結算預估</span>
            </div>
            <div class="text-center py-2">
                <span id="fixedTotal" class="text-4xl font-black font-mono">0</span>
                <span class="text-sm text-gray-500 ml-1">TWD</span>
            </div>
        </div>

        <div class="flex justify-between text-[10px] font-bold text-gray-400 px-2 mb-3 uppercase tracking-tighter">
            <span class="w-1/4">標的</span>
            <span class="w-1/4 text-center">即時市價</span>
            <span class="w-1/4 text-center">方向/股數</span>
            <span class="w-1/4 text-right">小計(現金流)</span>
        </div>

        <div id="stockList" class="space-y-1 mb-8 max-h-[45vh] overflow-y-auto pr-1"></div>

        <button id="execBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            確認並送出下單指令
        </button>
    </div>

    <script>
        let stockData = [];
        let mode = 'trade';

        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            mode = params.get('v') || 'trade';
            const raw = params.get('d');
            if (raw) stockData = JSON.parse(decodeURIComponent(raw));
            render();
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function render() {
            const listDiv = document.getElementById('stockList');
            let netSettlement = 0;

            listDiv.innerHTML = stockData.map(item => {
                const isBuy = item.a === "買進";
                // 💎 核心邏輯：買進是正向資金需求，賣出是負向（回流）💎
                const cashFlow = isBuy ? (item.s * item.p) : -(item.s * item.p);
                netSettlement += cashFlow;

                const colorClass = isBuy ? "text-red-500" : "text-blue-500";
                const sign = isBuy ? "+" : "-";

                return `
                <div class="flex justify-between items-center py-4 border-b border-gray-50">
                    <span class="font-black w-1/4 text-gray-800 text-sm">${item.i}</span>
                    <span class="text-gray-400 w-1/4 text-center text-xs font-mono">$${item.p}</span>
                    <div class="w-1/4 text-center">
                        <span class="text-[10px] font-bold ${colorClass}">${item.a}</span><br>
                        <span class="text-xs font-mono font-bold">${item.s.toLocaleString()}</span>
                    </div>
                    <span class="font-mono ${colorClass} w-1/4 text-right font-black text-sm">
                        ${sign}$${Math.abs(Math.floor(cashFlow)).toLocaleString()}
                    </span>
                </div>`;
            }).join('');
            
            // 更新上方總金額
            const totalDisplay = document.getElementById('fixedTotal');
            totalDisplay.innerText = Math.floor(netSettlement).toLocaleString();
            // 如果是負數（回流），金額變綠色或灰色
            totalDisplay.className = netSettlement >= 0 ? "text-4xl font-black font-mono text-red-500" : "text-4xl font-black font-mono text-green-400";
        }

        async function sendOrder() {
            const total = document.getElementById('fixedTotal').innerText;
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            try {
                const res = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mode: mode, net_total: total, details: stockData })
                });
                if (res.ok) {
                    liff.sendMessages([{type: 'text', text: `🚀 交割指令已發送\n淨額預估：$${total}`}]);
                    liff.closeWindow();
                }
            } catch (e) { alert("連線失敗"); }
        }
        main();
    </script>
</body>
</html>
