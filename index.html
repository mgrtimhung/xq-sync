<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Hung 執行系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 id="title" class="text-xl font-bold mb-4">策略投資比例試算</h1>
        
        <div class="bg-blue-50 p-4 rounded-xl mb-6">
            <label class="block text-xs font-bold text-blue-400 mb-1">投入金額 (TWD)</label>
            <input type="number" id="totalAmount" value="1000000" class="w-full bg-transparent text-2xl font-bold outline-none text-blue-900">
        </div>

        <div class="flex justify-between text-xs font-bold text-gray-400 px-2 mb-2">
            <span>標的</span><span class="text-center">參考價</span><span class="text-right">預計股數</span>
        </div>
        <div id="stockList" class="space-y-1 mb-6"></div>

        <button id="execBtn" class="w-full bg-black text-white py-4 rounded-xl font-bold">確認並送出訂單</button>
    </div>

    <script>
        let stockData = [];
        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            if (params.get('d')) {
                stockData = JSON.parse(decodeURIComponent(params.get('d')));
                renderList();
            }
            document.getElementById('totalAmount').addEventListener('input', renderList);
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function renderList() {
            const total = document.getElementById('totalAmount').value || 0;
            const per = total / stockData.length;
            const list = document.getElementById('stockList');
            list.innerHTML = stockData.map(item => {
                // 💎 解決除以 0 的邏輯 💎
                const shareText = (item.p > 0) ? Math.floor(per / item.p).toLocaleString() : `分配$${Math.floor(per).toLocaleString()}`;
                return `
                <div class="flex justify-between items-center py-3 border-b border-gray-50">
                    <span class="font-bold w-1/3">${item.i}</span>
                    <span class="text-gray-400 w-1/3 text-center">$${item.p}</span>
                    <span class="font-mono text-green-600 w-1/3 text-right">${shareText}</span>
                </div>`;
            }).join('');
        }

        async function sendOrder() {
            // 呼叫 ngrok 網址 (請填入您最新的 ngrok 網址)
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            const response = await fetch(ngrokUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user: "Tim", orders: stockData, total: document.getElementById('totalAmount').value})
            });
            if(response.ok) {
                liff.sendMessages([{type: 'text', text: '✅ 訂單已同步至後端伺服器'}]);
                liff.closeWindow();
            }
        }
        main();
    </script>
</body>
</html>
