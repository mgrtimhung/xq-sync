<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Hung 量化下單系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 id="title" class="text-2xl font-bold text-gray-800 mb-2">策略初始化建倉</h1>
        <p id="desc" class="text-sm text-gray-500 mb-6">請輸入預計投入的總金額，系統將自動均權分配標的。</p>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">投入總金額 (TWD)</label>
            <input type="number" id="totalAmount" placeholder="例如: 1000000" 
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div id="stockList" class="space-y-3 mb-6">
            </div>

        <button id="execBtn" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition">
            確認並送出訂單
        </button>
    </div>

    <script>
        let stockData = [];
        let version = "";

        async function main() {
            // 1. 初始化 LIFF
            await liff.init({ liffId: "YOUR_LIFF_ID" }); // 請替換成你的 LIFF ID

            // 2. 解析 URL 參數
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('d');
            version = urlParams.get('v');

            if (rawData) {
                stockData = JSON.parse(decodeURIComponent(rawData));
                renderStockList();
            }

            // 調整標題
            if (version !== 'init') {
                document.getElementById('title').innerText = "策略再平衡調倉";
                document.getElementById('desc').innerText = "根據今日 order.xlsx 指令進行調整。";
            }

            // 3. 監聽金額輸入
            document.getElementById('totalAmount').addEventListener('input', calculateShares);

            // 4. 監聽按鈕點擊
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function renderStockList() {
            const listDiv = document.getElementById('stockList');
            listDiv.innerHTML = stockData.map(item => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <span class="font-bold text-gray-700">${item.i}</span>
                    <span id="share-${item.i}" class="text-blue-600 font-medium">等待計算...</span>
                </div>
            `).join('');
        }

        function calculateShares() {
            const total = document.getElementById('totalAmount').value;
            if (!total || stockData.length === 0) return;

            const amountPerStock = total / stockData.length;
            
            stockData.forEach(item => {
                // 註：如果沒有即時價格，此處僅顯示分配金額，或提示預計股數
                const shareDisplay = document.getElementById(`share-${item.i}`);
                shareDisplay.innerText = `分配額: $${Math.floor(amountPerStock).toLocaleString()}`;
            });
        }

            const total = document.getElementById('totalAmount').value;
            if (!total) {
                alert("請輸入總金額");
                return;
            }

            // 傳
