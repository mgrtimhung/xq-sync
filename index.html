<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim 投資調度系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { background: rgba(255, 255, 255, 0.2); height: 10px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -9px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        <h1 id="pageTitle" class="text-2xl font-black text-gray-800 mb-1">指令執行</h1>
        <p id="pageDesc" class="text-[10px] text-gray-400 mb-6 tracking-widest uppercase">Precision Slider Version</p>
        
        <div id="initSection" class="hidden bg-blue-900 p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-blue-300">預計投入總金額 (均權分配)</span>
                <span class="text-[10px] bg-blue-700 px-2 py-0.5 rounded text-blue-100">50萬 - 1000萬</span>
            </div>
            <div class="text-center py-2">
                <span id="sliderVal" class="text-4xl font-black font-mono">1,000,000</span>
                <span class="text-sm text-blue-300 ml-1">TWD</span>
            </div>
            
            <input type="range" id="budgetSlider" 
                   min="500000" max="10000000" step="100000" value="1000000" 
                   class="w-full h-2 mt-4 cursor-pointer">
            
            <div class="flex justify-between mt-3 text-[10px] text-blue-400 font-bold px-1">
                <span>50 萬</span>
                <span>500 萬</span>
                <span>1000 萬</span>
            </div>
        </div>

        <div id="tradeSection" class="hidden bg-black p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-gray-500 uppercase">當日淨額交割預算</span>
                <span class="text-[10px] bg-blue-600 px-2 py-0.5 rounded text-white">指令導向</span>
            </div>
            <div class="text-center py-2">
                <span id="fixedTotal" class="text-4xl font-black font-mono">0</span>
                <span class="text-sm text-gray-500 ml-1">TWD</span>
            </div>
        </div>

        <div class="flex justify-between text-[10px] font-bold text-gray-400 px-2 mb-3 uppercase tracking-tighter">
            <span class="w-1/4">標的</span>
            <span id="priceLabel" class="w-1/4 text-center">價格基準</span>
            <span id="qtyLabel" class="w-1/4 text-center">計算股數</span>
            <span class="w-1/4 text-right">小計金額</span>
        </div>

        <div id="stockList" class="space-y-1 mb-8 max-h-[40vh] overflow-y-auto pr-1"></div>

        <button id="execBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            確認並發送指令
        </button>
    </div>

    <script>
        let stockData = [];
        let mode = 'init';

        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            mode = params.get('v') || 'init';
            const raw = params.get('d');
            if (raw) stockData = JSON.parse(decodeURIComponent(raw));

            if (mode === 'init') {
                document.getElementById('initSection').classList.remove('hidden');
                document.getElementById('pageTitle').innerText = "策略初始建倉";
                document.getElementById('priceLabel').innerText = "漲停參考價";
                document.getElementById('qtyLabel').innerText = "均權股數";
                document.getElementById('budgetSlider').addEventListener('input', render);
            } else {
                document.getElementById('tradeSection').classList.remove('hidden');
                document.getElementById('pageTitle').innerText = "今日調倉執行";
                document.getElementById('priceLabel').innerText = "即時市價";
                document.getElementById('qtyLabel').innerText = "固定股數";
            }
            render();
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function render() {
            const listDiv = document.getElementById('stockList');
            let grandTotal = 0;

            if (mode === 'init') {
                const budget = parseInt(document.getElementById('budgetSlider').value);
                document.getElementById('sliderVal').innerText = budget.toLocaleString();
                const perAmount = stockData.length > 0 ? Math.floor(budget / stockData.length) : 0;

                listDiv.innerHTML = stockData.map(item => {
                    const shares = item.p > 0 ? Math.floor(perAmount / item.p) : 0;
                    const sub = shares * item.p;
                    grandTotal += sub;
                    return `
                    <div class="flex justify-between items-center py-4 border-b border-gray-50">
                        <span class="font-black w-1/4 text-gray-800 text-sm">${item.i}</span>
                        <span class="text-gray-400 w-1/4 text-center text-xs font-mono">$${item.p}</span>
                        <span class="text-blue-600 w-1/4 text-center text-xs font-bold">${shares.toLocaleString()}</span>
                        <span class="font-mono text-gray-900 w-1/4 text-right font-black text-sm">$${sub.toLocaleString()}</span>
                    </div>`;
                }).join('');
            } else {
                listDiv.innerHTML = stockData.map(item => {
                    const isBuy = item.a === "買進";
                    const cash = isBuy ? (item.s * item.p) : -(item.s * item.p);
                    grandTotal += cash;
                    return `
                    <div class="flex justify-between items-center py-4 border-b border-gray-50">
                        <span class="font-black w-1/4 text-gray-800 text-sm">${item.i}</span>
                        <span class="text-gray-400 w-1/4 text-center text-xs font-mono">$${item.p}</span>
                        <div class="w-1/4 text-center">
                            <span class="text-[10px] font-bold ${isBuy?'text-red-500':'text-blue-500'}">${item.a}</span><br>
                            <span class="text-xs font-bold">${item.s.toLocaleString()}</span>
                        </div>
                        <span class="font-mono ${isBuy?'text-red-500':'text-blue-500'} w-1/4 text-right font-black text-sm">${isBuy?'+':'-'}$${Math.abs(Math.floor(cash)).toLocaleString()}</span>
                    </div>`;
                }).join('');
                document.getElementById('fixedTotal').innerText = Math.floor(grandTotal).toLocaleString();
                document.getElementById('fixedTotal').className = grandTotal >= 0 ? "text-4xl font-black font-mono text-red-500" : "text-4xl font-black font-mono text-green-400";
            }
        }

        async function sendOrder() {
            const total = mode === 'init' ? document.getElementById('budgetSlider').value : document.getElementById('fixedTotal').innerText;
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            try {
                const res = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mode: mode, total_amount: total, stocks: stockData })
                });
                if (res.ok) {
                    liff.sendMessages([{type: 'text', text: `🚀 ${mode==='init'?'建倉':'調倉'}下單完成\n金額：$${total}`}]);
                    liff.closeWindow();
                }
            } catch (e) { alert("連線 ngrok 失敗"); }
        }
        main();
    </script>
</body>
</html>
