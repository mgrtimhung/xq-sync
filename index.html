<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易發射台</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary: #1DB954; --dark: #002D72; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-top: 5px; }
        .btn-test { background: #4B7BFF; } .btn-cert { background: #FF9800; } .btn-main { background: var(--primary); }
        .btn-row { display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; border-bottom: 1px solid #eee; }
        .stock-id { font-weight: bold; color: var(--dark); }
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content:space-between;">
        <h3 style="margin:0;">🚀 交易發射台</h3>
        <button onclick="toggleSettings()" style="font-size:12px;">⚙️ 設定</button>
    </div>
    <div id="settings" style="display:none; margin-top:10px;">
        <input id="k" placeholder="API Key"> <input id="s" type="password" placeholder="Secret Key">
        <input id="p" placeholder="身分證"> <input id="c" type="password" placeholder="憑證密碼">
        <input type="file" id="f" onchange="readCert(this)">
        <div id="status" style="font-size:12px; color:green;"></div>
        <div class="btn-row">
            <button class="btn btn-test" onclick="vLogin()">1. 測登入</button>
            <button class="btn btn-cert" onclick="vCert()">2. 測憑證</button>
        </div>
        <button class="btn" style="background:#666;" onclick="save()">💾 儲存設定</button>
    </div>
</div>

<div id="amtBox" class="card" style="display:none; text-align:center;">
    <div style="font-size:12px; color:#666;">擬投入總金額</div>
    <input type="number" id="amt" value="500000" style="font-size:24px; text-align:center;" oninput="calc()">
</div>

<div class="card">
    <table id="list"></table>
</div>

<button id="exec" class="btn btn-main" onclick="send()">確認金額並送出</button>

<script>
    // ⚠️ 部署後請填寫真實資料
    const LIFF_ID = "2009650617-0XGQdM6J"; 
    const BACK_URL = "https://shioaji-bridge-timhung.onrender.com";

    let data = [], cert = "";

    async function init() {
        await liff.init({ liffId: LIFF_ID });
        load();
        const raw = new URLSearchParams(window.location.search).get('d');
        if (raw) {
            data = raw.split(',').map(i => {
                const [info, price, qty, action] = i.split(':');
                const [id, name] = info.split('_');
                return { id, name, price: parseFloat(price), action: action==='B'?'買進':'賣出' };
            });
            document.getElementById('amtBox').style.display='block';
            calc();
        }
    }

    function toggleSettings() { const s = document.getElementById('settings'); s.style.display = s.style.display==='block'?'none':'block'; }
    
    function readCert(i) {
        const fr = new FileReader();
        fr.onload = (e) => { cert = e.target.result.split(',')[1]; document.getElementById('status').innerText="✅ 憑證讀取成功"; };
        fr.readAsDataURL(i.files[0]);
    }

    function calc() {
        const total = parseInt(document.getElementById('amt').value) || 0;
        const per = total / data.length;
        const tb = document.getElementById('list'); tb.innerHTML = '';
        data.forEach(s => {
            s.qty = Math.floor(per / s.price);
            tb.innerHTML += `<tr><td><span class="stock-id">${s.id} ${s.name||''}</span><br><small>$${s.price}</small></td><td style="color:red; font-weight:bold;">買進</td><td style="text-align:right;">${s.qty} 股</td></tr>`;
        });
    }

    function save() {
        const cfg = { k:document.getElementById('k').value, s:document.getElementById('s').value, p:document.getElementById('p').value, c:document.getElementById('c').value, cert };
        localStorage.setItem('sj_cfg', JSON.stringify(cfg)); alert("✅ 儲存成功");
    }

    function load() {
        const saved = JSON.parse(localStorage.getItem('sj_cfg') || '{}');
        document.getElementById('k').value = saved.k||''; document.getElementById('s').value = saved.s||''; document.getElementById('p').value = saved.p||''; document.getElementById('c').value = saved.c||''; cert = saved.cert||'';
        if(cert) document.getElementById('status').innerText="✅ 已有備份憑證";
    }

    async function vLogin() {
        const res = await fetch(`${BACK_URL}/verify_login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({config:{k:document.getElementById('k').value, s:document.getElementById('apiSecret').value}}) });
        alert((await res.json()).message);
    }

    async function vCert() {
        const cfg = { k:document.getElementById('k').value, s:document.getElementById('s').value, p:document.getElementById('personId').value, c:document.getElementById('caPass').value, cert };
        const res = await fetch(`${BACKEND_URL}/verify_cert`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({config:cfg}) });
        alert((await res.json()).message);
    }

    async function send() {
        const cfg = JSON.parse(localStorage.getItem('sj_cfg'));
        const orders = data.map(s => ({ code:s.id, qty:s.qty, action:s.action, price:s.price })).filter(o=>o.qty>0);
        if(!confirm("確定下單？")) return;
        const res = await fetch(`${BACKEND_URL}/place_order`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({config:cfg, orders}) });
        alert((await res.json()).message);
    }

    init();
</script>
</body>
</html>
