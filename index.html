<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim 投資調度系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        <h1 id="pageTitle" class="text-2xl font-black text-gray-800 mb-1">指令執行</h1>
        <p id="pageDesc" class="text-[10px] text-gray-400 mb-6 tracking-widest uppercase">Ultra-Slim Version</p>
        
        <div id="initSection" class="hidden bg-blue-900 p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-blue-300">預計投入總金額 (均權分配)</span>
            </div>
            <div class="text-center py-2">
                <span id="sliderVal" class="text-4xl font-black font-mono">1,000,000</span>
                <span class="text-sm text-blue-300 ml-1">TWD</span>
            </div>
            <input type="range" id="budgetSlider" min="500000" max="10000000" step="100000" value="1000000" class="w-full h-2 mt-4 cursor-pointer">
        </div>

        <div id="tradeSection" class="hidden bg-black p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="text-center py-2">
                <span id="fixedTotal" class="text-4xl font-black font-mono">0</span>
                <span class="text-sm text-gray-500 ml-1">TWD</span>
            </div>
        </div>

        <div id="stockList" class="space-y-1 mb-8 max-h-[45vh] overflow-y-auto pr-1"></div>
        <button id="execBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg">確認指令並發送</button>
    </div>

    <script>
        let stockData = [];
        let mode = 'init';

        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            mode = params.get('v') || 'init';
            const raw = params.get('d');

            if (raw) {
                // 💎 瘦身版解碼邏輯 💎
                // 格式：代碼:價格:股數:動作,代碼:價格:股數:動作
                stockData = raw.split(',').map(item => {
                    const [i, p, s, a] = item.split(':');
                    return { i, p: parseFloat(p), s: parseInt(s), a: a === 'B' ? '買進' : '賣出' };
                });
            }

            if (mode === 'init') {
                document.getElementById('initSection').classList.remove('hidden');
                document.getElementById('budgetSlider').addEventListener('input', render);
            } else {
                document.getElementById('tradeSection').classList.remove('hidden');
            }
            render();
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function render() {
            const listDiv = document.getElementById('stockList');
            let total = 0;
            if (mode === 'init') {
                const budget = parseInt(document.getElementById('budgetSlider').value);
                document.getElementById('sliderVal').innerText = budget.toLocaleString();
                const per = Math.floor(budget / stockData.length);
                listDiv.innerHTML = stockData.map(item => {
                    const qty = Math.floor(per / item.p);
                    total += qty * item.p;
                    return rowTemplate(item.i, item.p, qty, qty * item.p, '買進');
                }).join('');
            } else {
                listDiv.innerHTML = stockData.map(item => {
                    const sub = item.s * item.p;
                    total += (item.a === '買進' ? sub : -sub);
                    return rowTemplate(item.i, item.p, item.s, sub, item.a);
                }).join('');
                document.getElementById('fixedTotal').innerText = Math.floor(total).toLocaleString();
                document.getElementById('fixedTotal').className = total >= 0 ? "text-4xl font-black font-mono text-red-500" : "text-4xl font-black font-mono text-green-400";
            }
        }

        function rowTemplate(i, p, q, s, a) {
            const isB = a === '買進';
            return `<div class="flex justify-between items-center py-4 border-b border-gray-50">
                <span class="font-black w-1/4 text-gray-800 text-sm">${i}</span>
                <span class="text-gray-400 w-1/4 text-center text-xs">$${p}</span>
                <span class="w-1/4 text-center text-xs font-bold ${isB?'text-red-500':'text-blue-500'}">${a}<br>${q}</span>
                <span class="font-mono ${isB?'text-red-500':'text-blue-500'} w-1/4 text-right font-black text-sm">${isB?'+':'-'}$${Math.abs(Math.floor(s)).toLocaleString()}</span>
            </div>`;
        }

        async function sendOrder() {
            // ... 維持原狀
            liff.closeWindow();
        }
        main();
    </script>
</body>
</html>
