<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化交易同步助手</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn { display: block; width: 100%; padding: 18px; background: #002D72; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .stock-list { background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; font-family: monospace; word-break: break-all; color: #444; }
        .success-msg { color: #28a745; font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="status">準備同步 20 支標的</h2>
        <div id="stockDisplay" class="stock-list">讀取中...</div>
        
        <button id="copyBtn" class="btn">📋 一鍵複製並開啟 XQ</button>
        <div id="msg" class="success-msg">✅ 已複製！請至 XQ 貼上匯入</div>
        
        <p style="font-size: 13px; color: #888; margin-top: 20px;">
            因系統限制，請點擊上方按鈕後，<br>自行開啟 XQ 於「自選股」貼上即可。
        </p>
    </div>

    <script>
        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            const symbols = params.get('symbols');

            if (symbols) {
                const cleanSymbols = symbols.replace(/\s/g, '');
                document.getElementById('stockDisplay').innerText = cleanSymbols;

                const btn = document.getElementById('copyBtn');
                btn.onclick = () => {
                    // 執行複製到剪貼簿
                    const el = document.createElement('textarea');
                    el.value = cleanSymbols;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);

                    // 顯示成功訊息
                    document.getElementById('msg').style.display = "block";
                    btn.innerText = "已複製，請開啟 XQ";
                    btn.style.background = "#28a745";

                    // 嘗試開啟 XQ (備援)
                    window.location.href = "xqlocal://import?symbols=" + cleanSymbols;
                    
                    // 5秒後自動關閉 LIFF
                    setTimeout(() => { liff.closeWindow(); }, 5000);
                };
            }
        }
        main();
    </script>
</body>
</html>
