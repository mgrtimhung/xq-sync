<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資比例試算</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 id="title" class="text-xl font-bold mb-4 flex items-center">🚀 投資比例試算</h1>
        
        <div class="bg-blue-900 p-5 rounded-2xl mb-6 shadow-inner">
            <label class="block text-xs font-bold text-blue-200 mb-1 uppercase tracking-widest">預計投入總金額 (TWD)</label>
            <input type="number" id="totalAmount" value="1000000" 
                   class="w-full bg-transparent text-3xl font-bold outline-none text-white border-b-2 border-blue-700 focus:border-blue-400 transition-all">
        </div>

        <div class="flex justify-between text-[10px] font-bold text-gray-400 px-2 mb-2 uppercase tracking-tighter">
            <span class="w-1/4">標的</span>
            <span class="w-1/4 text-center">漲停價</span>
            <span class="w-1/4 text-center">每檔分配</span>
            <span class="w-1/4 text-right">預計股數</span>
        </div>

        <div id="stockList" class="space-y-1 mb-8">
            </div>

        <button id="execBtn" class="w-full bg-black text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all hover:bg-gray-800">
            確認並送出訂單
        </button>
        
        <p class="text-center text-[10px] text-gray-300 mt-4 tracking-widest">TIM HUNG QUANTITATIVE SYSTEM</p>
    </div>

    <script>
        let stockData = [];

        async function main() {
            // 初始化 LIFF
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('d');
            if (raw) {
                stockData = JSON.parse(decodeURIComponent(raw));
                renderList();
            }

            // 監聽輸入與按鈕
            document.getElementById('totalAmount').addEventListener('input', renderList);
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function renderList() {
            const total = document.getElementById('totalAmount').value || 0;
            const count = stockData.length;
            
            // 💎 計算每一檔分配到的金額 💎
            const perAmount = count > 0 ? Math.floor(total / count) : 0;
            
            const listDiv = document.getElementById('stockList');
            listDiv.innerHTML = stockData.map(item => {
                // 計算預計股數 (如果價格 > 0)
                const shares = (item.p > 0) ? Math.floor(perAmount / item.p) : 0;
                
                return `
                <div class="flex justify-between items-center py-4 border-b border-gray-50 hover:bg-gray-50 transition-colors px-1">
                    <span class="font-bold w-1/4 text-gray-800 text-sm">${item.i}</span>
                    <span class="text-gray-400 w-1/4 text-center text-sm">$${item.p}</span>
                    <span class="text-blue-600 w-1/4 text-center text-sm font-medium">$${perAmount.toLocaleString()}</span>
                    <span class="font-mono text-green-600 w-1/4 text-right font-bold text-sm">${shares.toLocaleString()}</span>
                </div>`;
            }).join('');
        }

        async function sendOrder() {
            const total = document.getElementById('totalAmount').value;
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            
            try {
                const res = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: "Tim Hung",
                        total_investment: total,
                        allocation_per_stock: Math.floor(total / stockData.length),
                        stocks: stockData
                    })
                });
                
                if (res.ok) {
                    liff.sendMessages([{
                        type: 'text', 
                        text: `✅ 均權下單已確認\n總額：$${parseInt(total).toLocaleString()}\n每檔分配：$${Math.floor(total / stockData.length).toLocaleString()}\n標的數：${stockData.length} 檔`
                    }]);
                    liff.closeWindow();
                }
            } catch (e) {
                alert("連線失敗，請檢查後端伺服器 (ngrok) 是否啟動。");
            }
        }

        main();
    </script>
</body>
</html>
