<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化投資試算</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #002D72; margin: 0 0 15px 0; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .shares { color: #1DB954; font-weight: bold; text-align: right; }
        #debug { font-size: 10px; color: #ccc; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>💰 投資金額試算</h2>
    <label style="font-size: 12px; color: #666;">投入總額 (TWD)</label>
    <input type="number" id="budget" value="1000000" oninput="calculate()">

    <table id="stockTable">
        <thead>
            <tr>
                <th>代碼</th>
                <th>價格</th>
                <th style="text-align: right;">股數</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div id="debug">正在載入數據...</div>
</div>

<script>
    let stocks = [];

    async function main() {
        try {
            // 1. 初始化 LIFF (您的 ID)
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            
            // 2. 解析網址中的 data 參數
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('data');

            if (encodedData) {
                stocks = JSON.parse(decodeURIComponent(encodedData));
                document.getElementById('debug').innerText = "數據載入成功";
                calculate();
            } else {
                document.getElementById('debug').innerText = "未接收到股票數據";
            }
        } catch (err) {
            document.getElementById('debug').innerText = "錯誤: " + err.message;
        }
    }

    function calculate() {
        const budget = document.getElementById('budget').value || 0;
        const tbody = document.querySelector('#stockTable tbody');
        tbody.innerHTML = "";

        const perBudget = budget / stocks.length;

        stocks.forEach(s => {
            const shares = Math.floor(perBudget / s.price);
            const row = `<tr>
                <td><b>${s.id}</b></td>
                <td>$${s.price}</td>
                <td class="shares">${shares.toLocaleString()} 股</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    main();
</script>
</body>
</html>
