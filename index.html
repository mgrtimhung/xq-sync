<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資試算系統 V2</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.3); height: 12px; border-radius: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 30px; width: 30px; border-radius: 50%;
            background: #ffffff; cursor: pointer; margin-top: -9px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        <h1 id="title" class="text-2xl font-black text-gray-800 mb-6">策略投資試算</h1>
        
        <div class="bg-gradient-to-br from-blue-700 to-blue-900 p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-blue-200 uppercase tracking-widest">預計投入總金額</span>
                <span class="text-[10px] bg-blue-600 px-2 py-0.5 rounded-full">最小單位 10 萬</span>
            </div>
            
            <div class="text-center mb-6">
                <span id="amountDisplay" class="text-4xl font-black font-mono tracking-tighter">1,000,000</span>
                <span class="text-sm text-blue-300 ml-1">TWD</span>
            </div>
            
            <input type="range" id="totalAmountSlider" 
                   min="100000" max="10000000" step="100000" value="1000000" 
                   class="w-full h-3 cursor-pointer">
            
            <div class="flex justify-between mt-3 text-[10px] text-blue-300 font-bold">
                <span>10 萬</span>
                <span>500 萬</span>
                <span>1000 萬</span>
            </div>
        </div>

        <div class="flex justify-between text-[10px] font-bold text-gray-400 px-2 mb-3 uppercase tracking-widest">
            <span class="w-1/4">標的</span>
            <span class="w-1/4 text-center">漲停價</span>
            <span class="w-1/4 text-center">每檔分配</span>
            <span class="w-1/4 text-right">預計股數</span>
        </div>

        <div id="stockList" class="space-y-1 mb-8 max-h-[35vh] overflow-y-auto pr-1">
            </div>

        <button id="execBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            確認指令並送出
        </button>
        
        <div class="flex justify-between items-center mt-6 px-2">
            <span class="text-[9px] text-gray-300 tracking-widest uppercase">Tim Hung Quant</span>
            <span class="text-[9px] text-blue-400 font-bold bg-blue-50 px-2 py-0.5 rounded">V2.0 - SLIDER版</span>
        </div>
    </div>

    <script>
        let stockData = [];
        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('d');
            if (raw) {
                stockData = JSON.parse(decodeURIComponent(raw));
                renderList();
            }
            const slider = document.getElementById('totalAmountSlider');
            slider.addEventListener('input', function() {
                document.getElementById('amountDisplay').innerText = parseInt(this.value).toLocaleString();
                renderList();
            });
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function renderList() {
            const total = document.getElementById('totalAmountSlider').value;
            const per = stockData.length > 0 ? Math.floor(total / stockData.length) : 0;
            const listDiv = document.getElementById('stockList');
            listDiv.innerHTML = stockData.map(item => {
                const shares = (item.p > 0) ? Math.floor(per / item.p) : 0;
                return `
                <div class="flex justify-between items-center py-4 border-b border-gray-50">
                    <span class="font-black w-1/4 text-gray-800 text-sm">${item.i}</span>
                    <span class="text-gray-400 w-1/4 text-center text-xs font-mono">$${item.p}</span>
                    <span class="text-blue-600 w-1/4 text-center text-xs font-bold">$${per.toLocaleString()}</span>
                    <span class="font-mono text-green-600 w-1/4 text-right font-black text-sm">${shares.toLocaleString()}</span>
                </div>`;
            }).join('');
        }

        async function sendOrder() {
            const total = document.getElementById('totalAmountSlider').value;
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            try {
                const res = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({total: total, stocks: stockData})
                });
                if (res.ok) {
                    liff.sendMessages([{type: 'text', text: `🚀 下單指令發送成功 (總額 $${parseInt(total).toLocaleString()})`}]);
                    liff.closeWindow();
                }
            } catch (e) { alert("後端伺服器斷線"); }
        }
        main();
    </script>
</body>
</html>
