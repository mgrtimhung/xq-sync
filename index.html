<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交割金額試算</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        <h1 class="text-2xl font-black text-gray-800 mb-2">指令交割試算</h1>
        <p class="text-[10px] text-gray-400 mb-6 tracking-widest uppercase">Direct Execution Mode</p>
        
        <div class="bg-gradient-to-br from-gray-800 to-black p-6 rounded-[2rem] mb-6 text-white shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">估計交割金額 (不含稅費)</span>
                <span class="text-[10px] bg-green-600 px-2 py-0.5 rounded-full text-white">市場即時價</span>
            </div>
            <div class="text-center py-2">
                <span id="totalDisplay" class="text-4xl font-black font-mono tracking-tighter">0</span>
                <span class="text-sm text-gray-400 ml-1">TWD</span>
            </div>
        </div>

        <div class="flex justify-between text-[10px] font-bold text-gray-400 px-2 mb-3 uppercase tracking-widest">
            <span class="w-1/4">標的</span>
            <span class="w-1/4 text-center">當前市價</span>
            <span class="w-1/4 text-center">指令股數</span>
            <span class="w-1/4 text-right">小計金額</span>
        </div>

        <div id="stockList" class="space-y-1 mb-8 max-h-[40vh] overflow-y-auto pr-1">
            </div>

        <button id="execBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            確認並送出今日訂單
        </button>
        
        <div class="text-center mt-6">
            <span class="text-[9px] text-gray-300 tracking-[0.4em] uppercase">Tim Hung Trading System</span>
        </div>
    </div>

    <script>
        let stockData = [];
        async function main() {
            await liff.init({ liffId: "2009650617-0XGQdM6J" });
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('d');
            if (raw) {
                stockData = JSON.parse(decodeURIComponent(raw));
                calculateAndRender();
            }
            document.getElementById('execBtn').addEventListener('click', sendOrder);
        }

        function calculateAndRender() {
            let total = 0;
            const listDiv = document.getElementById('stockList');
            
            listDiv.innerHTML = stockData.map(item => {
                const subtotal = Math.floor(item.s * item.p); // 股數 * 市價
                total += subtotal;
                
                return `
                <div class="flex justify-between items-center py-4 border-b border-gray-50">
                    <span class="font-black w-1/4 text-gray-800 text-sm">${item.i}</span>
                    <span class="text-gray-400 w-1/4 text-center text-xs font-mono">$${item.p}</span>
                    <span class="text-gray-600 w-1/4 text-center text-xs font-bold">${item.s.toLocaleString()} 股</span>
                    <span class="font-mono text-blue-600 w-1/4 text-right font-black text-sm">$${subtotal.toLocaleString()}</span>
                </div>`;
            }).join('');
            
            document.getElementById('totalDisplay').innerText = total.toLocaleString();
        }

        async function sendOrder() {
            const ngrokUrl = "https://hemic-lakeshia-unmaintained.ngrok-free.dev/order";
            try {
                const res = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: "Tim Hung",
                        execution_time: new Date().toLocaleString(),
                        total_settlement: document.getElementById('totalDisplay').innerText,
                        orders: stockData
                    })
                });
                if (res.ok) {
                    liff.sendMessages([{type: 'text', text: `🚀 今日調倉已執行\n估計交割金額：$${document.getElementById('totalDisplay').innerText}`}]);
                    liff.closeWindow();
                }
            } catch (e) { alert("連線失敗，請檢查 ngrok"); }
        }
        main();
    </script>
</body>
</html>
