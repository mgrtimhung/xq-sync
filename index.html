<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>量化同步助手</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align:center; padding-top:100px; font-family:sans-serif; background:#f0f2f5;">
    <h2 id="status">正在初始化系統...</h2>
    <div id="debug" style="font-size:12px; color:gray; margin-top:20px;"></div>

    <script>
        async function main() {
            const debug = document.getElementById('debug');
            const status = document.getElementById('status');

            try {
                // 【關鍵】請把下方引號內換成您的 LIFF ID
                await liff.init({ liffId: "2009650617-0XGQdM6J" }); 
                
                debug.innerText = "LIFF 初始化成功";

                const urlParams = new URLSearchParams(window.location.search);
                const symbols = urlParams.get('symbols');

                if (symbols) {
                    status.innerText = "正在跳轉至 XQ App...";
                    const xqUrl = "xqlocal://import?symbols=" + symbols;
                    
                    // 執行跳轉
                    window.location.href = xqUrl;

                    // 備援機制：如果沒跳轉，提供按鈕
                    setTimeout(() => {
                        status.innerHTML = `
                            <p>若手機未自動彈出 XQ，請點擊下方：</p>
                            <a href="${xqUrl}" style="padding:15px 30px; background:#002D72; color:white; text-decoration:none; border-radius:5px;">手動開啟 XQ</a>
                        `;
                    }, 2000);

                } else {
                    status.innerText = "錯誤：網址未帶入股票代碼";
                }
            } catch (err) {
                status.innerText = "系統錯誤";
                debug.innerText = err.message;
            }
        }
        main();
    </script>
</body>
</html>
